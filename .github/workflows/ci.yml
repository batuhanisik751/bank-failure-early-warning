name: CI

# Lint, type-check and unit-test both halves of the repository on every push to main and
# every pull request (CONTRACT 17). The Python tests that need Postgres skip when
# DATABASE_URL is unset; the web unit tests never touch a database; the Playwright
# accessibility smoke needs a built app and a published database, so it runs locally
# (docs/RUNBOOK.md section 6), not here. Nothing here deploys anything.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest
        # Tests that need Postgres skip when DATABASE_URL is unset; everything else is synthetic.
        # Typer switches to a boxed, coloured help layout when GITHUB_ACTIONS is set, which
        # breaks the `--flag in --help output` tests, and the runner's GITHUB_OUTPUT would make
        # refresh.write_github_output write when the test expects it not to.
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: env -u GITHUB_OUTPUT uv run pytest

  web:
    name: Web (lint + typecheck + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest, no database)
        # Includes tests/schema.test.ts, which compares web/lib/db/schema.ts with
        # src/bankcanary/publish/schema.sql; the full checkout is required for that.
        run: npm test
