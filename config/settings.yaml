# BankCanary settings. Every tunable that the spec calls a config value lives here.
data_dir: data
models_dir: models
reports_dir: reports

# Report-date range for the bank-quarter panel (Decision Point 1: 1992-2000 not included by default).
start_quarter: "2001-03-31"
end_quarter: null          # null = latest quarter the FDIC API has published

# Point-in-time availability: a report dated q is usable from q + availability_lag_days.
availability_lag_days: 60

# Prediction horizons in quarters. Primary = 4 (12 months), secondary = 8 (24 months);
# 1 is the discrete-time hazard event ("fails inside the next quarter", step D7).
horizons_quarters: [1, 4, 8]

# Fixed out-of-time split for quick iteration (spec 8.2). The Rule 6.2 split utility still
# trims training rows whose outcome window closes after the first test prediction date.
fixed_split:
  train_start: "2002-03-31"
  train_end: "2008-12-31"
  test_start: "2010-03-31"
  test_end: "2013-12-31"

# Peer buckets by total assets, in thousands of dollars (the FDIC unit):
# <$100M, $100M-$1B, $1B-$10B, $10B-$100B, >$100B
peer_asset_buckets_thousands: [100000, 1000000, 10000000, 100000000]

fdic:
  base_url: "https://api.fdic.gov/banks/"
  docs_url: "https://api.fdic.gov/banks/docs/"
  page_size: 10000
  requests_per_second: 4      # the API advertises a 20-request window; stay well under it
  timeout_seconds: 120
  max_retries: 6

fred:
  api_url: "https://api.stlouisfed.org/fred/series/observations"   # used when FRED_API_KEY is set
  csv_url: "https://fred.stlouisfed.org/graph/fredgraph.csv"        # keyless fallback
  requests_per_second: 2
  timeout_seconds: 60
  max_retries: 5

# Gradient boosting (step D6): written by scripts/tune_gbdt.py from the inner validation
# slice. backend = the library every gbdt step must use; monotone = Decision Point 2.
models:
  gbdt:
    backend: lightgbm
    monotone: true
    params:
      learning_rate: 0.03
      min_samples_leaf: 200
      n_estimators: 200
      num_leaves: 63
    inner_pr_auc:
      gbdt: 0.229933
      gbdt_mono: 0.196765
      logit_v2: 0.258907
