[project]
name = "bankcanary"
version = "0.1.0"
description = "Open, reproducible early-warning system for US bank failures built on FDIC Call Report data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Batuhan Isik" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.9",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[project.scripts]
bankcanary = "bankcanary.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankcanary"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM"]
ignore = ["N803", "N806", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
